---
# Tier-1 quick e2e: minikube + Rook Ceph smoke on every PR.
# Complements (does NOT replace) CentOS mini-e2e via ok-to-test.
name: e2e-minikube-tier1
"on":
  pull_request:
    branches:
      - devel
      - "release-v*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KUBE_VERSION: v1.35.1
  GO_VERSION_FILE: go.mod

jobs:
  e2e-tier1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Source build.env
        run: |
          set -a
          # shellcheck disable=SC1091
          source build.env
          set +a
          {
            echo "MINIKUBE_VERSION=${MINIKUBE_VERSION}"
            echo "ROOK_VERSION=${ROOK_VERSION}"
            echo "ROOK_CEPH_CLUSTER_IMAGE=\
          ${ROOK_CEPH_CLUSTER_IMAGE}"
            echo "SNAPSHOT_VERSION=${SNAPSHOT_VERSION}"
            echo "VM_DRIVER=${VM_DRIVER}"
            echo "CSI_IMAGE_VERSION=\
          ${CSI_IMAGE_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Install cri-dockerd
        run: |
          V="0.3.17"
          GH="https://github.com/Mirantis"
          GH="${GH}/cri-dockerd"
          TGZ="cri-dockerd-${V}.amd64.tgz"
          DL="${GH}/releases/download/v${V}"
          curl -sfLO "${DL}/${TGZ}"
          tar -xzf "${TGZ}"
          sudo install -m 0755 \
            cri-dockerd/cri-dockerd \
            /usr/local/bin/cri-dockerd
          rm -rf cri-dockerd "${TGZ}"
          RAW="${GH}/raw/v${V}/packaging"
          for u in cri-docker.service \
              cri-docker.socket; do
            curl -sfLO "${RAW}/systemd/${u}"
            sudo install -m 0644 \
              "${u}" /etc/systemd/system/
          done
          sudo sed -i \
            's|/usr/bin/cri-dockerd|/usr/local/bin/cri-dockerd|' \
            /etc/systemd/system/cri-docker.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now \
            cri-docker.socket

      - name: Install minikube prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            conntrack socat
          # crictl
          CRICTL_VER="v1.35.0"
          CRICTL_TAR="crictl-${CRICTL_VER}"
          CRICTL_TAR+="-linux-amd64.tar.gz"
          CRICTL_BASE="https://github.com"
          CRICTL_BASE+="/kubernetes-sigs/cri-tools"
          CRICTL_BASE+="/releases/download"
          curl -sLO \
            "${CRICTL_BASE}/${CRICTL_VER}/${CRICTL_TAR}"
          sudo tar -xzf "${CRICTL_TAR}" \
            -C /usr/local/bin
          rm -f "${CRICTL_TAR}"
          # CNI plugins
          CNI_VER="v1.6.2"
          CNI_TAR="cni-plugins-linux-amd64"
          CNI_TAR+="-${CNI_VER}.tgz"
          CNI_BASE="https://github.com"
          CNI_BASE+="/containernetworking/plugins"
          CNI_BASE+="/releases/download"
          CNI_DIR="/opt/cni/bin"
          sudo mkdir -p "${CNI_DIR}"
          curl -sLO \
            "${CNI_BASE}/${CNI_VER}/${CNI_TAR}"
          sudo tar -xzf "${CNI_TAR}" \
            -C "${CNI_DIR}"
          rm -f "${CNI_TAR}"

      - name: Setup minikube
        run: |
          sudo sysctl fs.protected_regular=0
          scripts/minikube.sh up
        env:
          MEMORY: "6144"

      - name: Prepare disk for OSD
        run: >-
          scripts/github-action-helper.sh prepare_disk

      - name: Pre-pull Ceph image
        run: >-
          docker pull quay.io/ceph/ceph:v20

      - name: Deploy Rook + Ceph
        run: scripts/minikube.sh deploy-rook
        env:
          ROOK_DEPLOY_TIMEOUT: "600"
          KUBECTL_RETRY_DELAY: "5"

      - name: Install snapshot controller
        run: >-
          scripts/minikube.sh install-snapshotter

      - name: Build ceph-csi image
        run: make image-cephcsi
        env:
          CONTAINER_CMD: docker

      - name: Load ceph-csi + sidecar images
        run: |
          scripts/minikube.sh cephcsi
          scripts/minikube.sh k8s-sidecar

      - name: Build e2e.test
        run: make e2e.test

      - name: Run tier1 e2e
        run: |
          cd e2e && ../e2e.test \
            -test.v -ginkgo.v \
            --ginkgo.label-filter=tier1 \
            --ginkgo.timeout=15m \
            --deploy-timeout=10 \
            --test-rbd=true \
            --test-cephfs=true \
            --test-nfs=true \
            --test-nvmeof=false \
            --deploy-rbd=true \
            --deploy-cephfs=true \
            --skip-vault=true \
            --cephcsi-namespace=default

      - name: Collect logs on failure
        if: failure()
        run: >-
          scripts/github-action-helper.sh collect_logs

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-e2e-logs
          path: /tmp/tier1-e2e-logs/
          retention-days: 7
